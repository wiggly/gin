version = "3.11.5"
runner.dialect = scala3
maxColumn = 100

# Braces delimit scope in this codebase, not significant whitespace (see CLAUDE.md).
# Both of these default to off; they are pinned so that a future scalafmt default,
# or someone reaching for a rewrite rule, cannot quietly reformat the tree into
# indentation syntax.
rewrite.scala3.convertToNewSyntax = false
rewrite.scala3.removeOptionalBraces = false

align.preset = more
docstrings.style = SpaceAsterisk
docstrings.wrap = no
