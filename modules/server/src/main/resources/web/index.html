<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gin Rummy</title>
    <link rel="stylesheet" href="/gin.css" />
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <pattern id="weave" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <rect width="6" height="6" fill="#7a1f24" />
          <rect width="3" height="6" fill="#962a30" />
        </pattern>
      </defs>
    </svg>
    <div id="app"></div>
    <script type="module">
      import { TyrianApp } from "/main.js";
      TyrianApp.launch("app");
    </script>
  </body>
</html>
