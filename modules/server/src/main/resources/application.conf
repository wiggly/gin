# The environment variables the server reads, with the defaults that work unchanged in a
# container. They are quoted because the environment can only ever supply a string, so a
# default and an override are read by the same decoder.
#
# Naming them here, rather than reaching for `${?GIN_HTTP_HOST}`, keeps the substitutions
# below resolvable from this file alone: they never fall through to the environment of the
# machine we happen to be running on, only to the one `AppConfig.from` is given.
GIN_HTTP_HOST             = "0.0.0.0"
GIN_HTTP_PORT             = "8080"
GIN_HTTP_SHUTDOWN_TIMEOUT = "30 seconds"

gin {
  http {
    # 0.0.0.0 rather than loopback: a container's port is only reachable if we
    # listen on the external interface.
    host             = ${GIN_HTTP_HOST}
    port             = ${GIN_HTTP_PORT}
    shutdown-timeout = ${GIN_HTTP_SHUTDOWN_TIMEOUT}
  }
}
